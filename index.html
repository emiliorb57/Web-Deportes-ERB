        /* VARIABLES GLOBALES DE COLORES Y ESTILOS REUTILIZABLES */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: rgba(255, 255, 255, 0.95);
            --accent: #007bff;
            --accent-hover: #0056b3;
            --focus-ring: #00e5ff;
            --text-main: #f0f6fc;
            --text-dark: #1f2328;
            --header-bg: #1F305E;
            --card-border: #ff2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-primary);  
            background-image: linear-gradient(rgba(13, 17, 23, 0.92), rgba(13, 17, 23, 0.92));
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center; 
            overflow-x: hidden;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: linear-gradient(180deg, #152244 0%, #1F305E 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid rgba(0, 123, 255, 0.4);
            padding: 5px 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-content {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        
        .logo-title-group {
            cursor: pointer;
        }

        .title h1, .logo-title-group h1 {
            font-size: 35px;
            font-weight: 800;          
            color: #ffffff;           
        }

        .tv-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            background: rgba(0, 229, 255, 0.15);
            border: 1px solid rgba(0, 229, 255, 0.4);
            padding: 1px 10px;
            border-radius: 20px;
            color: #00e5ff;
            white-space: nowrap;
        }

        .category-home {
            width: 100%;
            max-width: 1450px;
            margin: 22px auto 30px;
            padding: 0 16px;
        }

        .category-home-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            align-items: start;
            gap: 15px;
            justify-content: center;
        }

        .category-card {
            width: 95%;       
            max-width: 100%;     
            height: 150px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(145deg, rgba(31,48,94,.96), rgba(18,27,48,.96));
            border: 2px solid #2d4778;
            border-radius: 16px;
            box-shadow: 0 5px 16px rgba(0,0,0,.35);
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .category-card:hover,
        .category-card:focus {
            transform: translateY(-5px);
            border-color: #00e5ff;
            box-shadow: 0 8px 22px rgba(0,229,255,.22);
            outline: none;
        }

        .category-card img {
            width: 200px;
            height: auto;
            object-fit: contain;
        }

        .category-card span {
            font-size: 35px;
            font-weight: 700;
            line-height: 1.15;
        }

        .back-categories-btn {
            background: #1c2b4b;
            border: 1px solid #3c5b91;
            color: #fff;
            border-radius: 9px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .back-categories-btn:hover,
        .back-categories-btn:focus {
            border-color: #00e5ff;
            color: #00e5ff;
            outline: none;
        }

        .servers-page {
            display: none;
            flex-direction: column;
            max-width: 1300px;
            width: 100%;
            margin: 18px auto 30px;
            padding: 0 16px;
            animation: fadeIn 0.3s ease;
            align-self: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .servers-header {
            background: #141b2b;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            border: 1px solid #23314d;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .servers-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .servers-info-left h2 {
            font-size: 30px;
            color: #ffffff;
            font-weight: 700;
        }

        .servers-info-left .category-tag {
            font-size: 20px;
            background: green;
            padding: 3px 10px;
            border-radius: 6px;
            color: yellow;
            font-weight: 700;
        }

        .servers-list-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            width: 100%;
        }

        .server-pill {             /*boton servidores*/
            background: #1c263c;
            border: 2px solid #334366;
            color: #d1d9e6;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 25px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .server-pill:hover {
            background: #2a3a5c;
            color: #fff;
            border-color: #00e5ff;
            transform: translateY(-3px);
        }

        .header-action-btn {   /*boton cerrar pagina servidores*/
            background: brown;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: silver;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .header-action-btn:hover {
            background: rgba(0, 0, 0, 0.75);
            border-color: #00e5ff;
            color: #00e5ff;
        }

        .header-action-btn.close-btn:hover {
            border-color: #dc3545;
            color: #ff4d4d;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1600px;
            margin: 18px auto 0;
            padding: 0 16px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .grid-header {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin: 6px auto 0;
            padding: 8px 0 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            width: 100%;
            max-width: 1600px;
        }

        .grid-header h2 {      /*categoria filtrada*/
            font-size: 35px;
            font-weight: 700;
            color: yellow;
            display: flex;
            align-items: center;
            gap: 40px;    
        }

        .cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
            align-items: stretch;
            gap: 16px;
            width: 100%;
            max-width: 1450px;
            margin: 0 auto;
        }
        
        .card {
            background: var(--bg-card);
            border: 3px solid var(--card-border);
            border-radius: 14px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: underline;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            width: fit-content;
            max-width: 100%;
            flex: 0 1 auto;
            height: auto;
            min-height: 0;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            position: relative;
            outline: none;
            user-select: none;
        }

                align-items: start;
                gap: 12px;

            .category-card img {

            .category-card span {

                font-size: 22px;
                font-weight: 700;
                line-height: 1.15;
                overflow-wrap: break-word;

            .cards-container {

                min-height: 0;
                padding: 12px 16px;
                justify-content: center;

            .servers-header {

            font-weight: 700;
            line-height: 1.2;

            overflow-wrap: normal;

            color: #444;
            background: rgba(0, 0, 0, 0.08);

            font-size: 9px;
            font-weight: 800;
            color: #fff;
            background: #28a745;
            padding: 1px 5px;
            border-radius: 4px;
            margin-top: 2px;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #8b9bb4;
            margin: 0 auto;
        }

        footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 5px;
            text-align: left;
            font-size: 12px;
            color: #6e7681;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        footer p {
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
        }

        footer strong {
            color: #00e5ff;
        }
    </style>
</head>

    let currentCategory = "Todos";

        const channelsGrid = document.getElementById("channelsGrid");
        const sectionTitle = document.getElementById("sectionTitle");
        const emptyState = document.getElementById("emptyState");
        const serversPage = document.getElementById("serversPage");
        const serversTitle = document.getElementById("serversTitle");
        const serversCategory = document.getElementById("serversCategory");
        const serversList = document.getElementById("serversList");
        const mainContainer = document.getElementById("mainContainer");
        const categoryHome = document.getElementById("categoryHome");
        const categoryInfo = document.getElementById("categoryInfo");

        function renderChannels() {
            const filteredChannels = CHANNELS_DATA.filter(ch => {
                return (currentCategory === "Todos" || ch.category === currentCategory);
            });

            sectionTitle.innerHTML = `<span>${currentCategory === "Todos" ? "Todos los Canales" : currentCategory}</span>`;

            if (filteredChannels.length === 0) {
                channelsGrid.innerHTML = "";
                emptyState.style.display = "block";
                return;
            }

            emptyState.style.display = "none";

            channelsGrid.innerHTML = filteredChannels.map((channel) => {
                const hasM3U8 = channel.sources.some(s => s.type === "m3u8");
                const serverCount = channel.sources.length;
                const safeId = channel.id.replace(/'/g, "\\'");

                return `
                    <div class="card"
                         tabindex="0"
                         role="button"
                         onclick="openChannelInNewTab('${safeId}')"
                         onkeydown="handleCardKey(event, '${safeId}')"
                         title="${channel.title} - ${channel.category}">
                        <div class="card-body">
                            <div class="card-title">${channel.title}</div>
                            <div class="card-server-badge">${serverCount} ${serverCount === 1 ? 'opción' : 'servidores'}</div>
                            ${hasM3U8 ? '<br><span class="card-m3u8-tag">⚡ M3U8</span>' : ''}
                        </div>
                    </div>
                `;
            }).join("");
        }

        function selectCategory(categoryName) {
            currentCategory = categoryName;

            categoryHome.style.display = "none";
            serversPage.style.display = "none";
            categoryInfo.style.display = "flex";
            mainContainer.style.display = "flex";

            renderChannels();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showCategories() {
            mainContainer.style.display = "none";
            categoryInfo.style.display = "none";
            serversPage.style.display = "none";
            categoryHome.style.display = "";
            currentCategory = "Todos";
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function openChannelInNewTab(channelId) {
            const newWindowUrl = `${window.location.pathname}?channel=${encodeURIComponent(channelId)}`;
            window.open(newWindowUrl, '_blank');
        }

        function openServerUrlInNewTab(url) {
            if (url) {
                window.open(url, '_blank');
            }
        }

        function showChannelServers(channelId) {
            const channel = CHANNELS_DATA.find(ch => ch.id === channelId);
            if (!channel || !channel.sources || channel.sources.length === 0) return;

            serversTitle.textContent = channel.title;
            serversCategory.textContent = channel.category;

            serversList.innerHTML = channel.sources.map((src) => `
                <button class="server-pill"
                        tabindex="0"
                        onclick="openServerUrlInNewTab('${src.url.replace(/'/g, "\\'")}')">
                    ${src.type === 'm3u8' ? '⚡ ' : ''}↗ ${src.name}
                </button>
            `).join("");

            serversPage.style.display = "flex";
        }

        function closeServersPage() {
            window.close();
            window.location.href = window.location.pathname;
        }

        function resetFilters() {
            selectCategory("Todos");
        }

        function handleCardKey(e, channelId) {
            if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                openChannelInNewTab(channelId);
            }
        }

        // Navegación con flechas en Modo TV
        document.addEventListener("keydown", (e) => {
            if (!["ArrowRight", "ArrowLeft", "ArrowDown", "ArrowUp"].includes(e.key)) return;

            const active = document.activeElement;
            const focusables = Array.from(document.querySelectorAll("button, [tabindex='0']")).filter(el => {
                const rect = el.getBoundingClientRect();
                return rect.width > 0 && rect.height > 0 && getComputedStyle(el).visibility !== "hidden";
            });

            if (focusables.length === 0) return;

            const currentIndex = focusables.indexOf(active);
            if (currentIndex === -1) {
                e.preventDefault();
                focusables[0].focus();
                return;
            }

            e.preventDefault();
            if (e.key === "ArrowRight" || e.key === "ArrowDown") {
                focusables[(currentIndex + 1) % focusables.length].focus();
            } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
                focusables[(currentIndex - 1 + focusables.length) % focusables.length].focus();
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const channelParam = urlParams.get('channel');

            if (channelParam) {
                mainContainer.style.display = "none";
                categoryHome.style.display = "none";
                categoryInfo.style.display = "none";
                showChannelServers(channelParam);
            } else {
                categoryHome.style.display = "";
                categoryInfo.style.display = "none";
                mainContainer.style.display = "none";
            }
        });
    </script>
</body>
</html>
